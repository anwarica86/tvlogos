# One-time Rotana logo import. Source URLs appear in rotana.net/en/channels.
# Store channel artwork in this PUBLIC logo repository for IPTV clients.
name: Import Rotana channel artwork

on:
  push:
    paths:
      - .github/workflows/import-rotana-logos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotana-logo-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch and validate official artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p groups/rotana
          while read -r slug asset_id; do
            dest="groups/rotana/${slug}.webp"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 45 \
              "https://s3.eu-central-1.amazonaws.com/rotana.website/channels/${asset_id}.webp" -o "${dest}"
            python3 - "${dest}" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          if len(data) < 300 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("Refusing invalid or empty WebP image: " + str(path))
          print(path, "verified", len(data), "bytes")
          PY
          done <<'LOGOS'
          rotana-cinema-ksa 1688402472
          rotana-cinema-masr 1688402537
          rotana-comedy 1688402522
          rotana-classic 1688402529
          rotana-drama 1688402515
          rotana-khaleejiya 1688402508
          lbc 1688402500
          rotana-clip 1688402593
          rotana-music 1688402600
          al-resalah 1688402619
          LOGOS
      - name: Commit channel artwork to the public repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add groups/rotana/*.webp
          if git diff --cached --quiet; then
            echo "Artwork already up to date"
          else
            git commit -m "Add official Rotana channel artwork"
            git push
          fi
