name: Prepare Rotana PNG Logos

on:
  push:
    paths:
      - .github/workflows/prepare-rotana-png.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Validate and convert official artwork to PNG
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 45 \
            'https://rotana.net/logos/cinemamasr/blue.png' \
            -o /tmp/rotana-cinemamasr-official.png
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          root = Path("groups/rotana")
          for src in sorted(root.glob("*.webp")):
              if src.stem == "rotana-cinema-masr":
                  continue
              with Image.open(src) as im:
                  im.load()
                  if min(im.size) < 100:
                      raise ValueError(f"Too small: {src}")
                  rgba = im.convert("RGBA")
                  rgba.save(root / (src.stem + ".png"), format="PNG", optimize=True)
                  print(f"{src.stem}: {im.width}x{im.height} to PNG")
          with Image.open("/tmp/rotana-cinemamasr-official.png") as im:
              im.load()
              if min(im.size) < 100:
                  raise ValueError("Cinema Masr official image unexpectedly small")
              im.convert("RGBA").save(root / "rotana-cinema-masr.png", format="PNG", optimize=True)
              print(f"Cinema Masr official image: {im.width}x{im.height} to PNG")
          outputs = sorted(root.glob("*.png"))
          if len(outputs) != 10 or any(p.stat().st_size < 500 for p in outputs):
              raise ValueError(f"Expected 10 non-empty PNG logos, found {len(outputs)}")
          PY
      - name: Commit verified PNG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add groups/rotana/*.png
          if git diff --cached --quiet; then
            echo "Logos already up to date"
          else
            git commit -m "Add PNG copies of Rotana channel logos"
            git push
          fi
