name: Import Kuwait TV Logos

on:
  push:
    paths:
      - .github/workflows/import-kuwait-logos.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download and verify Kuwait channel artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p groups/kuwait
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          while read -r slug image_id; do
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 12 --max-time 45 \
              "https://i.imgur.com/${image_id}.png" -o "/tmp/${slug}.source"
            python3 - "${slug}" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          slug = sys.argv[1]
          src = Path('/tmp') / (slug + '.source')
          with Image.open(src) as im:
              im.load()
              if min(im.size) < 70 or max(im.size) > 5000:
                  raise SystemExit('Unexpected logo dimensions for ' + slug)
              if im.format not in ('PNG', 'JPEG', 'WEBP'):
                  raise SystemExit('Unexpected image format for ' + slug)
              im.convert('RGBA').save(Path('groups/kuwait') / (slug + '.png'), 'PNG', optimize=True)
              print(slug, im.size, im.format)
          PY
          done <<'IMAGES'
          ktv1 kG0d8Ay
          ktv2 hB57mNh
          ktv-news erZ0Ol1
          ktv-sport R1hGX1d
          ktv-sport-plus l4oX0gf
          ktv-al-qurain naVEZtj
          ktv-al-arabe jg3VAxO
          ktv-ethraa hqEbc49
          IMAGES
          test "$(find groups/kuwait -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 8
      - name: Save artwork to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add groups/kuwait/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add Kuwait Television PNG logos"
            git push
          else
            echo "No logo changes"
          fi
